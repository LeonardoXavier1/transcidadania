<style>/* =====================================================================
   TRANS CIDADANIA — Design Tokens
   ---------------------------------------------------------------------
   Tema claro / saúde — superfícies brancas, cores da bandeira trans
   como acentos vibrantes sobre fundo neutro.
   Tipografia: Fraunces (display) + DM Sans (corpo/UI)
   ===================================================================== */

/* DM Sans — Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap');

/* Fraunces — self-hosted variable serif (títulos editoriais) */
/* Fraunces loaded via Google Fonts above */

:root {
  /* ── Bandeira Trans ───────────────────────────────────────── */
  --trans-blue:  #5BCEFA;
  --trans-pink:  #F5A9B8;
  --trans-white: #FFFFFF;

  /* ── Deep navy (primário) ────────────────────────────────── */
  --deep:   #0A3D62;
  --deep-2: #0c2b44;

  /* ── Ink (texto) ─────────────────────────────────────────── */
  --ink:    #1A1A2E;
  --ink-60: rgba(26, 26, 46, 0.62);
  --ink-40: rgba(26, 26, 46, 0.42);
  --ink-28: rgba(26, 26, 46, 0.28);

  /* ── Superfícies (tema claro) ────────────────────────────── */
  --bg:           #FFFFFF;
  --bg-subtle:    #F8F9FB;
  --bg-blue-tint: #EFF8FF;

  /* ── Tints suaves ────────────────────────────────────────── */
  --blue-soft: color-mix(in oklab, var(--trans-blue) 16%, white);
  --pink-soft: color-mix(in oklab, var(--trans-pink) 18%, white);

  /* ── Âmbar ───────────────────────────────────────────────── */
  --amber:      #E8A33D;
  --amber-soft: #FCF3E2;

  /* ── Bordas ──────────────────────────────────────────────── */
  --line:        rgba(10, 61, 98, 0.10);
  --line-strong: rgba(10, 61, 98, 0.18);

  /* ── Sombras ─────────────────────────────────────────────── */
  --shadow-sm: 0 1px 2px rgba(10, 61, 98, 0.06);
  --shadow-md: 0 10px 30px -12px rgba(10, 61, 98, 0.22);
  --shadow-lg: 0 24px 60px -20px rgba(10, 61, 98, 0.30);
  --shadow-xl: 0 32px 80px -24px rgba(10, 61, 98, 0.36);

  /* ── Glows (anel + halo) ─────────────────────────────────── */
  --glow-blue:  0 0 0 1.5px rgba(91, 206, 250, 0.45), 0 8px 24px rgba(91, 206, 250, 0.18);
  --glow-pink:  0 0 0 1.5px rgba(245, 169, 184, 0.45), 0 8px 24px rgba(245, 169, 184, 0.18);
  --glow-lilac: 0 0 0 1.5px rgba(139, 79, 190, 0.40),  0 8px 24px rgba(139, 79, 190, 0.14);
  --glow-mint:  0 0 0 1.5px rgba(0, 150, 122, 0.40),   0 8px 24px rgba(0, 150, 122, 0.14);

  /* ── Radii ───────────────────────────────────────────────── */
  --r-xs:   6px;
  --r-sm:   10px;
  --r-md:   16px;
  --r-lg:   22px;
  --r-xl:   28px;
  --r-pill: 999px;
  --radius:    16px;
  --radius-sm: 10px;
  --radius-lg: 24px;

  /* ── Acentos por seção ───────────────────────────────────── */
  --accent-blue:   #2B9EC8;
  --accent-pink:   #D45E7A;
  --accent-lilac:  #8B4FBE;
  --accent-mint:   #00967A;
  --accent-orange: #E8A33D;

  /* ── Semânticas ──────────────────────────────────────────── */
  --success: #00967A;
  --warning: #E8A33D;
  --danger:  #C73A5A;
  --info:    #2B9EC8;
  --link:    #0A3D62;

  /* ── Gradientes ──────────────────────────────────────────── */
  --grad-flag:       linear-gradient(120deg, #5BCEFA 0%, #FFFFFF 50%, #F5A9B8 100%); /* @kind color */
  --grad-flag-vivid: linear-gradient(120deg, #5BCEFA 0%, #C77DFF 50%, #F5A9B8 100%); /* @kind color */
  --grad-hero:       linear-gradient(135deg, #FFFFFF 0%, #EFF8FF 60%, #FFF0F5 100%); /* @kind color */
  --grad-pink-blue:  linear-gradient(135deg, #F5A9B8 0%, #5BCEFA 100%); /* @kind color */

  /* ── Escala de espaçamento (base 4px) ────────────────────── */
  --s-1: 4px;   --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 20px;  --s-6: 24px;  --s-8: 32px;  --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px; --s-24: 96px;

  /* ── Layout ──────────────────────────────────────────────── */
  --maxw:      1280px;
  --gutter:    clamp(20px, 4vw, 48px); /* @kind spacing */
  --ease-expo: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */

  /* ── Tipografia — famílias ───────────────────────────────── */
  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'DM Sans', system-ui, -apple-system, sans-serif;
  --font-serif:   var(--font-display);
  --font-sans:    var(--font-body);

  /* ── Escala tipográfica (clamp responsiva) ───────────────── */
  --fs-h1:      clamp(2.1rem, 1.4rem + 2.6vw, 3rem); /* @kind other */
  --fs-h2:      clamp(1.6rem, 1.2rem + 1.4vw, 2rem); /* @kind other */
  --fs-h3:      1.375rem;
  --fs-body:    1.0625rem;
  --fs-caption: 0.8125rem;

  /* ── Escala tipográfica (shorthand) ─────────────────────── */
  --display:  700 56px/1.04 var(--font-display);
  --h1:       600 40px/1.08 var(--font-display);
  --h2:       600 30px/1.14 var(--font-display);
  --h3:       600 22px/1.24 var(--font-display);
  --h4:       700 17px/1.30 var(--font-body);
  --body-lg:  400 18px/1.6  var(--font-body);
  --body:     400 16px/1.6  var(--font-body);
  --body-sm:  400 14px/1.55 var(--font-body);
  --caption:  700 13px/1.4  var(--font-body);
  --overline: 700 12px/1.2  var(--font-body);
  --label:    700 14px/1.2  var(--font-body);

  /* ── Aliases de compatibilidade (nomes do tema escuro) ───── */
  --fg-1:      var(--ink);
  --fg-2:      var(--ink-60);
  --fg-3:      var(--ink-40);
  --fg-muted:  var(--ink-28);
  --border:    var(--line);
  --border-strong: var(--line-strong);
  --bg-base:   var(--bg-subtle);
  --bg-900:    var(--bg);
  --bg-800:    var(--bg-subtle);
  --bg-700:    #EBF0F9;
  --surface-1: var(--bg);
  --surface-2: var(--bg-subtle);
  --surface-3: #DCE3F2;
  --surface-hero: var(--grad-hero);
  --glass-fill:   rgba(255, 255, 255, 0.80);
  --glass-fill-2: #FFFFFF;
  --glass-border: var(--line);
  --glass-blur:   14px;
  --pink-strong:  #C75272;
  --blue-strong:  #1F7FAB;
  --pink-soft-2:  #FDE8EE;
  --blue-soft-2:  #DFF1FA;
  --border-accent-blue:  rgba(43, 158, 200, 0.35);
  --border-accent-pink:  rgba(212, 94, 122, 0.35);
  --border-accent-lilac: rgba(139, 79, 190, 0.30);
  --border-accent-mint:  rgba(0, 150, 122, 0.30);
}

/* ── Classes utilitárias ─────────────────────────────────────────── */
.tc-grad-text {
  background: var(--grad-flag-vivid);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.tc-display { font: var(--display); letter-spacing: -0.02em; }
.tc-h1      { font: var(--h1);      letter-spacing: -0.02em; }
.tc-h2      { font: var(--h2);      letter-spacing: -0.01em; }
.tc-h3      { font: var(--h3); }
.tc-overline { font: var(--overline); text-transform: uppercase; letter-spacing: 0.12em; }

/* ── Eyebrow (overline com traço) ────────────────────────────────── */
.eyebrow {
  font-family: var(--font-body);
  font-size: var(--fs-caption);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--deep);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.eyebrow::before {
  content: '';
  width: 22px;
  height: 2px;
  background: var(--trans-pink);
  border-radius: 2px;
}
</style>

<script>/* =====================================================================
   Lucide icon helper for Trans Cidadania
   ---------------------------------------------------------------------
   Lucide is the brand's icon set (line style, 2px stroke, rounded caps).
   Load Lucide UMD from CDN, then call lucideIcon(name, opts) to get an
   <svg> string, or data-lucide attributes auto-replaced by lucide.createIcons().

   In plain HTML:
     <script src="https://unpkg.com/lucide@latest"><\/script>
     <i data-lucide="heart-pulse"></i>
     <script>lucide.createIcons();<\/script>

   In React (this repo uses the UMD global, not lucide-react):
     <Icon name="heart-pulse" size={28} color="var(--accent-blue)" />
   ===================================================================== */

window.lucideIcon = function (name, { size = 24, color = 'currentColor', stroke = 2 } = {}) {
  const el = document.createElement('i');
  el.setAttribute('data-lucide', name);
  el.style.color = color;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.setProperty('--lucide-stroke', stroke);
  return el;
};

/* React wrapper (expects window.lucide UMD + React in scope) */
window.Icon = function Icon({ name, size = 24, color = 'currentColor', strokeWidth = 2, style = {} }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      i.setAttribute('stroke-width', strokeWidth);
      ref.current.appendChild(i);
      window.lucide.createIcons({ attrs: { width: size, height: size } });
    }
  }, [name, size, strokeWidth]);
  return React.createElement('span', {
    ref,
    style: { display: 'inline-flex', width: size, height: size, color, lineHeight: 0, ...style },
  });
};
</script>
<script type="text/babel">/* Primitives: shared data, tokens, and base components — LIGHT THEME */

const ACCENTS = {
  blue:  { color:'var(--accent-blue)',  glow:'var(--glow-blue)',  soft:'var(--blue-soft)',  border:'var(--border-accent-blue)' },
  pink:  { color:'var(--accent-pink)',  glow:'var(--glow-pink)',  soft:'var(--pink-soft)',  border:'var(--border-accent-pink)' },
  lilac: { color:'var(--accent-lilac)', glow:'var(--glow-lilac)', soft:'rgba(139,79,190,.08)', border:'var(--border-accent-lilac)' },
  mint:  { color:'var(--accent-mint)',  glow:'var(--glow-mint)',  soft:'rgba(0,150,122,.07)', border:'var(--border-accent-mint)' },
  orange:{ color:'var(--accent-orange)',glow:'none',              soft:'rgba(217,112,48,.08)', border:'rgba(217,112,48,.38)' },
};

const SECTIONS = [
  { id:'processo',    label:'Processo Transexualizador', icon:'heart-pulse', accent:'blue',
    desc:'O que é, quem tem direito, base legal e cada etapa do processo no SUS.' },
  { id:'hormonio',    label:'Hormonioterapia',           icon:'pill',        accent:'pink',
    desc:'Como funciona, tipos de hormônios e alertas de segurança.' },
  { id:'retificacao', label:'Retificação de Nome',       icon:'file-text',   accent:'lilac',
    desc:'Como mudar nome e gênero nos documentos, direto em cartório, sem processo judicial.' },
  { id:'locais',      label:'Locais de Apoio',           icon:'map-pin',     accent:'mint',
    desc:'Organizações, serviços de saúde mental e jurídico por estado e região.' },
  { id:'denuncia',    label:'Como Denunciar',            icon:'shield',      accent:'orange',
    desc:'Canais oficiais e o passo a passo para registrar uma denúncia.', navLabel:'Denúncia' },
  { id:'biblioteca',  label:'Biblioteca',                icon:'book-open',   accent:'blue',
    desc:'Legislação, portarias e documentos oficiais de referência para consulta.' },
];

function Button({ children, variant='primary', icon, iconRight, onClick, accent='blue' }) {
  const base = {
    display:'inline-flex', alignItems:'center', gap:9, font:'var(--label)', border:'none',
    cursor:'pointer', borderRadius:'var(--r-pill)', padding:'13px 22px',
    transition:'.22s cubic-bezier(.22,1,.36,1)',
  };
  const styles = {
    primary: { ...base,
      background:'var(--fg-1)', color:'#fff',
      boxShadow:'var(--shadow-sm)',
    },
    secondary: { ...base,
      background:'var(--surface-1)', color:'var(--fg-2)',
      border:'1.5px solid var(--border)', boxShadow:'var(--shadow-sm)',
    },
    outline: { ...base,
      background:'transparent', color:ACCENTS[accent].color,
      border:`1.5px solid ${ACCENTS[accent].border}`,
    },
    ghost: { ...base,
      background:'transparent', color:'var(--fg-3)', padding:'10px 14px',
    },
  };
  const [h, setH] = React.useState(false);
  const hover = {
    primary:   h ? { background:'#2a2f5e', boxShadow:'var(--shadow-md)', transform:'translateY(-1px)' } : {},
    secondary: h ? { borderColor:'var(--border-strong)', boxShadow:'var(--shadow-md)', transform:'translateY(-1px)' } : {},
    outline:   h ? { background:ACCENTS[accent].soft, transform:'translateY(-1px)' } : {},
    ghost:     h ? { color:'var(--fg-2)' } : {},
  };
  return (
    <button style={{ ...styles[variant], ...hover[variant] }}
      onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      onMouseDown={e=>{ e.currentTarget.style.transform='scale(.97)'; }}
      onMouseUp={e=>{ e.currentTarget.style.transform=''; }}
      onClick={onClick}>
      {icon && <Icon name={icon} size={17} />}
      {children}
      {iconRight && <Icon name={iconRight} size={16} />}
    </button>
  );
}

function Badge({ children, accent, onClick }) {
  const a = accent ? ACCENTS[accent] : null;
  const [h, setH] = React.useState(false);
  const clickable = !!onClick;
  return (
    <span onClick={onClick}
      onMouseEnter={() => clickable && setH(true)}
      onMouseLeave={() => clickable && setH(false)}
      style={{
        font:'var(--caption)', padding:'6px 13px', borderRadius:'var(--r-pill)',
        background: clickable && h ? (a ? a.color : 'var(--fg-2)') : (a ? a.soft : 'var(--surface-2)'),
        border:`1px solid ${clickable && h ? (a ? a.color : 'var(--border)') : (a ? a.border : 'var(--border)')}`,
        color: clickable && h ? '#fff' : (a ? a.color : 'var(--fg-2)'),
        whiteSpace:'nowrap', cursor: clickable ? 'pointer' : 'default',
        transition: clickable ? 'background .15s, color .15s, border-color .15s, transform .15s, box-shadow .15s' : 'none',
        display:'inline-flex', alignItems:'center', gap:5,
        transform: clickable && h ? 'translateY(-2px)' : 'none',
        boxShadow: clickable && h ? 'var(--shadow-sm)' : 'none',
        userSelect:'none',
      }}>
      {children}
      {clickable && <span style={{ fontSize:9, opacity: h ? 1 : 0.55, transition:'opacity .15s' }}>↗</span>}
    </span>
  );
}

function GlassCard({ children, style, accent, hoverable=true }) {
  const [h, setH] = React.useState(false);
  const a = accent ? ACCENTS[accent] : null;
  return (
    <div onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      style={{

        borderRadius:'var(--r-lg)',
        boxShadow: hoverable && h ? 'var(--shadow-lg)' : 'var(--shadow-sm)',
        transform: hoverable && h ? 'translateY(-4px)' : 'none',
        transition:'.25s cubic-bezier(.22,1,.36,1)', ...style,
      }}>{children}</div>

}

function Overline({ children, color='var(--accent-blue)' }) {
  return <div style={{ font:'var(--overline)', textTransform:'uppercase', letterSpacing:'.12em', color, marginBottom:10 }}>{children}</div>;
}

function SectionWrap({ children, style }) {
  return <div style={{ maxWidth:1120, margin:'0 auto', padding:'0 24px', ...style }}>{children}</div>;
}

function Divider() {
  return <hr style={{ border:'none', borderTop:'1px solid var(--border)', margin:'40px 0' }} />;
}

Object.assign(window, { ACCENTS, SECTIONS, Button, Badge, GlassCard, Overline, SectionWrap, Divider });

<script type="text/babel">/* Header — sticky nav, mobile drawer, active section, desktop CTA */

function Header({ go, openChat }) {

  const [activeId,  setActiveId]  = React.useState(null);
  const [menuOpen,  setMenuOpen]  = React.useState(false);

  /* shadow ao scrollar */
  React.useEffect(() => {
    const el = document.getElementById('scroll-root');
    const fn = () => setScrolled((el?.scrollTop || 0) > 8);
    el?.addEventListener('scroll', fn);
    return () => el?.removeEventListener('scroll', fn);
  }, []);

  /* IntersectionObserver — destaca seção visível */
  React.useEffect(() => {
    const root = document.getElementById('scroll-root');
    const t = setTimeout(() => {
      const els = SECTIONS.map(s => document.getElementById('sec-'+s.id)).filter(Boolean);
      if (!els.length) return;
      const obs = new IntersectionObserver(entries => {
        const vis = entries
          .filter(e => e.isIntersecting)
          .sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (vis.length) setActiveId(vis[0].target.id.replace('sec-',''));
      }, { root, rootMargin:'-15% 0px -55% 0px', threshold:0 });
      els.forEach(e => obs.observe(e));
      return () => obs.disconnect();
    }, 400);
    return () => clearTimeout(t);
  }, []);

  /* Escape fecha o drawer */
  React.useEffect(() => {
    if (!menuOpen) return;
    const h = e => { if (e.key==='Escape') setMenuOpen(false); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [menuOpen]);

  /* trava scroll do root quando drawer aberto — não toca no overflow em outros estados */
  React.useEffect(() => {
    if (!menuOpen) return;
    const root = document.getElementById('scroll-root');
    if (!root) return;
    const prev = root.style.overflowY;
    root.style.overflowY = 'hidden';
    return () => { root.style.overflowY = prev; };

            </Button>
          </div>

          {/* Hamburger — mobile only */}
          <button className="tc-hamburger" onClick={() => setMenuOpen(v => !v)}
            aria-label={menuOpen ? 'Fechar menu' : 'Abrir menu'}

              display:'none', alignItems:'center', justifyContent:'center',
              background:'none', border:'1px solid var(--border)', cursor:'pointer',

      {/* ── Mobile backdrop ────────────────────────────── */}
      <div onClick={() => setMenuOpen(false)} style={{

      }} />

      {/* ── Mobile drawer ──────────────────────────────── */}
      <aside style={{
        position:'fixed', top:0, right:0, bottom:0, zIndex:49,
        width:'min(310px, 90vw)',

        boxShadow:'-20px 0 64px rgba(10,61,98,.18)',

                  <Icon name={l.icon} size={17} color={a.color} />
                </div>
                <div style={{ minWidth:0 }}>

<script type="text/babel">/* Hero.jsx — left-aligned two-column layout, floating topic cards */

/* ── Floating topic cards (right column) ──────────────────────── */
function HeroFloatingCards({ go }) {
  const [hovered, setHovered] = React.useState(null);
  const [clicked, setClicked] = React.useState(null);

  /* cascade geometry: top offset, right inset, base z-index */
  const layout = [
    { top:  0, right:  0, z: 4, rot:  2.5, floatDur: 3.6, floatY: 11 },
    { top: 88, right: 26, z: 3, rot: -1.5, floatDur: 4.1, floatY:  8 },
    { top:176, right: 52, z: 2, rot:  1.2, floatDur: 3.8, floatY: 13 },
    { top:264, right: 78, z: 1, rot: -2.5, floatDur: 4.3, floatY:  9 },
  ];

  const handleClick = (i) => {
    setClicked(i);
    setTimeout(() => setClicked(null), 320);
    if (go) go(SECTIONS[i].id);
  };

  return (
    <div style={{ position:'relative', height:'100%' }}>
      {SECTIONS.slice(0, layout.length).map((s, i) => {
        const a   = ACCENTS[s.accent];
        const cfg = layout[i];
        const isHov = hovered === i;
        const isOth = hovered !== null && !isHov;
        const isClk = clicked === i;

        return (
          /* ── outer: hover/click transitions ── */
          <div key={s.id}
            onMouseEnter={() => setHovered(i)}
            onMouseLeave={() => setHovered(null)}
            onClick={() => handleClick(i)}
            style={{
              position: 'absolute',
              top:   cfg.top,
              right: cfg.right,
              zIndex: isHov ? 10 : cfg.z,
              transform: isClk
                ? 'scale(0.97) translateY(-5px)'
                : isHov ? 'scale(1.05) translateY(-14px)'
                : isOth ? 'scale(0.94)' : 'scale(1)',
              opacity: isOth ? 0.62 : 1,
              transition: 'transform .34s cubic-bezier(.22,1,.36,1), opacity .22s',
              cursor: 'pointer',
            }}>

            {/* ── inner: float animation (never pauses) ── */}
            <div style={{
              width: 272,
              background: isClk ? a.soft : 'var(--surface-1)',
              border: `1.5px solid ${isHov ? a.color : a.border}`,
              borderRadius: 'var(--r-lg)',
              padding: '14px 16px',
              boxShadow: isHov
                ? `0 28px 64px rgba(10,61,98,.15), 0 6px 18px ${a.soft}`
                : `0 ${6+i*4}px ${18+i*8}px rgba(10,61,98,.07), 0 2px 5px rgba(10,61,98,.04)`,
              animation: `heroFloat${i} ${cfg.floatDur}s ease-in-out infinite`,
              animationDelay: `${i * 0.28}s`,
              transition: 'background .15s, box-shadow .28s, border-color .2s',
            }}>
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>

                {/* icon pill */}
                <div style={{
                  width:40, height:40, borderRadius:'var(--r-md)', flexShrink:0,
                  background: a.soft,
                  /* box-shadow avoids CSS-var transition flash */
                  boxShadow: isHov ? `0 0 0 1.5px ${a.color}55` : 'none',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  transition: 'box-shadow .2s',
                }}>
                  <Icon name={s.icon} size={18} color={a.color} />
                </div>

                {/* text */}
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{
                    font: 'var(--label)',
                    color: isHov ? a.color : 'var(--fg-1)',
                    lineHeight: 1.25,
                    transition: 'color .2s',
                  }}>{s.label}</div>
                  <div style={{
                    font: 'var(--caption)',
                    color: 'var(--fg-3)',
                    marginTop: 3,
                    lineHeight: 1.4,
                    display: '-webkit-box',
                    WebkitLineClamp: 2,
                    WebkitBoxOrient: 'vertical',
                    overflow: 'hidden',
                  }}>{s.desc}</div>
                </div>

                {/* hover arrow */}
                <span style={{
                  fontSize: 16,
                  color: a.color,
                  flexShrink: 0,
                  opacity: isHov ? 1 : 0,
                  transform: isHov ? 'translateX(0)' : 'translateX(-8px)',
                  transition: 'opacity .2s, transform .2s',
                }}>→</span>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Hero({ go, openChat }) {
  return (
    <section style={{
      background:'var(--surface-hero)', position:'relative', overflowX:'clip',

    }}>

            {/* pill tag */}
            <div style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'6px 14px',
              borderRadius:'var(--r-pill)', background:'var(--surface-1)',

            </h1>

            {/* body */}

              }}>Explorar conteúdo</Button>
              <Button variant="secondary" icon="message-circle" onClick={openChat}>
                Guia de Dúvidas
              </Button>
            </div>
          </div>

          {/* ── Right: floating topic cards ──────────── */}
          <div style={{ position:'relative', height:380, minWidth:0 }}>
            <HeroFloatingCards go={go} />
          </div>
        </div>
      </SectionWrap>

      <style>{`
        /* float animations — rotation stays fixed per card, only Y moves */
        @keyframes heroFloat0 {
          0%,100% { transform: rotate(2.5deg)  translateY(0px);   }
          50%     { transform: rotate(2.5deg)  translateY(-11px); }
        }
        @keyframes heroFloat1 {
          0%,100% { transform: rotate(-1.5deg) translateY(0px);  }
          50%     { transform: rotate(-1.5deg) translateY(-8px); }
        }
        @keyframes heroFloat2 {
          0%,100% { transform: rotate(1.2deg)  translateY(0px);   }
          50%     { transform: rotate(1.2deg)  translateY(-13px); }
        }
        @keyframes heroFloat3 {
          0%,100% { transform: rotate(-2.5deg) translateY(0px);  }
          50%     { transform: rotate(-2.5deg) translateY(-9px); }
        }
        @media(max-width:860px){
          .hero-grid { grid-template-columns:1fr!important; }
          .hero-grid > *:last-child { display:none; }
        }
      `}</style>
    </section>
  );
}

Object.assign(window, { Hero });
</script>

<script type="text/babel">/* Animations.jsx — scroll-reveal + shared motion helpers */

/**
 * FadeIn: wraps children in an IntersectionObserver reveal.
 * Gracefully degrades (visible immediately) if IO not available or motion disabled.
 */
function FadeIn({ children, delay=0, y=20, style={}, tag='div' }) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);

  React.useEffect(() => {
    // Respect reduced-motion preference — show immediately
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setVisible(true); return;
    }
    if (!window.IntersectionObserver) { setVisible(true); return; }
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } },
      { threshold: 0.08, rootMargin: '0px 0px -40px 0px', root: document.getElementById('scroll-root') }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return React.createElement(tag, {
    ref,
    style: {
      opacity:    visible ? 1 : 0,
      transform:  visible ? 'none' : `translateY(${y}px)`,
      transition: `opacity .6s cubic-bezier(.22,1,.36,1) ${delay}ms, transform .6s cubic-bezier(.22,1,.36,1) ${delay}ms`,
      willChange: 'opacity, transform',
      ...style,
    }
  }, children);
}

/**
 * FadeInGroup: stagger-wraps each direct child in a FadeIn.
 * stagger = ms delay increment between children.
 */
function FadeInGroup({ children, stagger=80, baseDelay=0, y=18 }) {
  return (
    <>
      {React.Children.map(children, (child, i) => (
        <FadeIn key={i} delay={baseDelay + i * stagger} y={y}>
          {child}
        </FadeIn>
      ))}
    </>
  );
}

Object.assign(window, { FadeIn, FadeInGroup });
</script>

/* ── Formatador de texto ──────────────────────────────────────── */
function BotText({ text }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
      {text.split('\n').map((line, i) => {
        if (!line.trim()) return <div key={i} style={{ height:5 }} />;
        const parts = line.split(/\*\*(.*?)\*\*/g);
        return (
          <div key={i} style={{ lineHeight:1.6 }}>
            {parts.map((p, j) => j % 2 === 1 ? <strong key={j}>{p}</strong> : p)}
          </div>
        );
      })}
    </div>
  );
}

      { icon:'building-2',  label:'PROTIG / HCPA',        detail:'Porto Alegre, saúde trans',        color:'#00967A' },
      { icon:'globe',       label:'ANTRA',                detail:'antrabrasil.org',                   color:'#2B9EC8' },
    ],
  },
};

/* ── Componente principal ─────────────────────────────────────── */
function Chatbot({ open, setOpen, targetNode, setTargetNode }) {
  /* lista plana de mensagens */
  const [msgs, setMsgs] = React.useState(() =>
    TREE.root.msgs.map(t => ({ from:'bot', text:t }))
  );
  const [nodeId, setNodeId] = React.useState('root');
  const [shown, setShown]   = React.useState(false);
  const [isOut, setIsOut]   = React.useState(false);
  const scrollRef = React.useRef(null);

  /* deep-link: navega para nó específico ao abrir */
  React.useEffect(() => {
    if (open && targetNode) {
      const node = TREE[targetNode];
      if (node) {
        const rootMsgs = TREE.root.msgs.map(t => ({ from:'bot', text:t }));
        const targetMsgs = node.msgs.map(t => ({ from:'bot', text:t }));
        setMsgs([...rootMsgs, ...targetMsgs]);
        setNodeId(targetNode);
      }
      if (setTargetNode) setTargetNode(null);
    }
  }, [open, targetNode]);

  /* pulse ring — mostra até o usuário abrir pela 1ª vez */
  const [pulse, setPulse] = React.useState(() => !localStorage.getItem('tc_chat_opened'));

  /* sincroniza com prop open */
  React.useEffect(() => {
    if (open) { setShown(true); setIsOut(false); }
  }, [open]);

  /* animação de fechar */
  const triggerClose = React.useCallback(() => {
    setIsOut(true);
    setTimeout(() => { setShown(false); setIsOut(false); setOpen(false); }, 280);
  }, [setOpen]);

  /* reinicia ao fechar */
  React.useEffect(() => {
    if (!shown) {
      setTimeout(() => {
        setMsgs(TREE.root.msgs.map(t => ({ from:'bot', text:t })));
        setNodeId('root');
      }, 120);
    }
  }, [shown]);

  /* fecha com Escape */
  React.useEffect(() => {
    if (!open) return;
    const h = e => { if (e.key === 'Escape') triggerClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [open, triggerClose]);

  /* scroll para fim */
  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs]);

  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const node = TREE[nodeId];

  const navigate = (nextId, userLabel) => {
    const nextNode = TREE[nextId];
    if (!nextNode) return;
    const additions = [];
    if (userLabel) additions.push({ from:'user', text:userLabel });
    nextNode.msgs.forEach(t => additions.push({ from:'bot', text:t }));
    setMsgs(prev => [...prev, ...additions]);
    setNodeId(nextId);
  };

  const goBack = () => {
    const backId = node?.back || 'root';
    navigate(backId, null);
  };

  const reset = () => {
    setMsgs(TREE.root.msgs.map(t => ({ from:'bot', text:t })));
    setNodeId('root');
  };

  const ACCENT_COLOR = { blue:'#2B9EC8', pink:'#D45E7A', lilac:'#8B4FBE', mint:'#00967A', orange:'#E8A33D' };
  const ACCENT_SOFT  = { blue:'rgba(91,206,250,.13)', pink:'rgba(245,169,184,.15)', lilac:'rgba(139,79,190,.11)', mint:'rgba(0,150,122,.10)', orange:'rgba(232,163,61,.10)' };

  return (
    <>
      {/* Backdrop */}
      {shown && (
        <div onClick={triggerClose}
          style={{ position:'fixed', inset:0, zIndex:59, background:'transparent' }} />
      )}

      {/* FAB */}
      <button onClick={() => {
          if (!open) { localStorage.setItem('tc_chat_opened','1'); setPulse(false); }
          open ? triggerClose() : setOpen(true);
        }}
        aria-label="Abrir guia de dúvidas"
        style={{
          position:'fixed', bottom:24, right:24, zIndex:62,
          display:'flex', alignItems:'center', gap:9,
          padding: open ? '13px' : '13px 20px',
          borderRadius:'999px', border:'none', cursor:'pointer',
          background:'#1A1A2E', color:'#fff',
          boxShadow:'0 10px 40px rgba(10,61,98,.32)',
          font:'700 14px/1 var(--font-body, system-ui)',
          transition:'.22s cubic-bezier(.22,1,.36,1)',
          animation: pulse && !open ? 'fabPulse 2.2s ease-in-out 1.4s 4' : 'none',
        }}>
        <Icon name={open ? 'x' : 'message-circle'} size={20} color="#fff" />
        {!open && <span className="chat-fab-label">Guia de Dúvidas</span>}
      </button>

      {/* Modal */}
      {shown && (
        <div onClick={e => e.stopPropagation()}
          style={{
            position:'fixed', bottom:88, right:24, zIndex:61,
            width:'min(420px, calc(100vw - 32px))',
            height:'min(720px, calc(100vh - 110px))',
            display:'flex', flexDirection:'column',
            background:'#FFFFFF',
            border:'1px solid rgba(10,61,98,.12)',
            borderRadius:'22px',
            boxShadow:'0 24px 80px -16px rgba(10,61,98,.32)',
            overflow:'hidden',
            animation: isOut ? 'chatOut .26s cubic-bezier(.22,1,.36,1) forwards' : 'chatIn .28s cubic-bezier(.22,1,.36,1)',
          }}>

          {/* Header */}
          <div style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px',
            borderBottom:'1px solid rgba(10,61,98,.10)', background:'#F8F9FB', flexShrink:0 }}>
            <div style={{ width:38, height:38, borderRadius:10, display:'grid', placeItems:'center',
              background:'linear-gradient(120deg,#5BCEFA,#C77DFF 50%,#F5A9B8)', flexShrink:0 }}>
              <Icon name="compass" size={19} color="#fff" />
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontWeight:700, fontSize:14, color:'#1A1A2E', fontFamily:'var(--font-body, system-ui)' }}>
                Guia de Dúvidas
              </div>
              <div style={{ fontSize:11, color:'rgba(26,26,46,.45)', marginTop:1,
                fontFamily:'var(--font-body, system-ui)' }}>
                Respostas baseadas em fontes oficiais
              </div>
            </div>
            <button onClick={triggerClose}
              style={{ background:'none', border:'none', cursor:'pointer', color:'rgba(26,26,46,.4)', padding:4, lineHeight:0 }}>
              <Icon name="x" size={18} />
            </button>
          </div>

          {/* Messages */}
          <div ref={scrollRef} style={{ flex:1, overflowY:'auto', overflowX:'hidden',
            padding:'16px 14px', display:'flex', flexDirection:'column', gap:8 }}>

            {msgs.map((m, i) => (
              <div key={i} style={{ alignSelf: m.from==='user' ? 'flex-end' : 'flex-start',
                maxWidth:'88%', minWidth:0 }}>
                <div style={{
                  padding:'10px 14px',
                  borderRadius: m.from==='user' ? '14px 14px 4px 14px' : '14px 14px 14px 4px',
                  background: m.from==='user' ? '#1A1A2E' : '#F8F9FB',
                  color: m.from==='user' ? '#fff' : '#1A1A2E',
                  border: m.from==='user' ? 'none' : '1px solid rgba(10,61,98,.10)',
                  fontSize:14, lineHeight:1.5, wordBreak:'break-word', overflowWrap:'anywhere',
                  fontFamily:'var(--font-body, system-ui)',
                }}>
                  {m.from==='bot' ? <BotText text={m.text} /> : m.text}
                </div>
              </div>
            ))}

            {/* Contacts (apoio node) */}
            {node?.isSupport && node.contacts && (
              <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:4 }}>
                {node.contacts.map((c, i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px',
                    borderRadius:'12px', background:'#F8F9FB',
                    border:'1px solid rgba(10,61,98,.10)', boxShadow:'0 1px 3px rgba(10,61,98,.06)' }}>
                    <div style={{ width:32, height:32, borderRadius:8, display:'grid', placeItems:'center',
                      background:`${c.color}1a`, border:`1px solid ${c.color}44`, flexShrink:0 }}>
                      <Icon name={c.icon} size={15} color={c.color} />
                    </div>
                    <div style={{ minWidth:0, fontFamily:'var(--font-body, system-ui)' }}>
                      <div style={{ fontWeight:700, fontSize:13, color:'#1A1A2E' }}>{c.label}</div>
                      <div style={{ fontSize:11, color:'rgba(26,26,46,.45)', marginTop:1 }}>{c.detail}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Options */}
          {node?.opts && (
            <div style={{ padding:'10px 12px', borderTop:'1px solid rgba(10,61,98,.10)',
              background:'#FFFFFF', display:'flex', flexDirection:'column', gap:6,
              flexShrink:0 }}>
              {node.opts.map((opt, i) => {
                const color = opt.accent ? ACCENT_COLOR[opt.accent] : '#2B9EC8';
                const soft  = opt.accent ? ACCENT_SOFT[opt.accent]  : 'rgba(91,206,250,.13)';
                return (
                  <button key={i} onClick={() => navigate(opt.id, opt.label)}
                    style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 13px',
                      borderRadius:'10px', background:'#F8F9FB',
                      border:'1px solid rgba(10,61,98,.10)',
                      fontSize:14, color:'rgba(26,26,46,.65)',
                      cursor:'pointer', textAlign:'left', transition:'.15s',
                      fontFamily:'var(--font-body, system-ui)',
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background=soft; e.currentTarget.style.borderColor=color+'66'; e.currentTarget.style.color=color; }}
                    onMouseLeave={e => { e.currentTarget.style.background='#F8F9FB'; e.currentTarget.style.borderColor='rgba(10,61,98,.10)'; e.currentTarget.style.color='rgba(26,26,46,.65)'; }}>
                    {opt.icon && <Icon name={opt.icon} size={15} color={color} />}
                    <span style={{ flex:1 }}>{opt.label}</span>
                    <Icon name="chevron-right" size={13} color="rgba(26,26,46,.28)" />
                  </button>
                );
              })}
            </div>
          )}

          {/* Nav bar */}
          <div style={{ padding:'9px 12px', borderTop:'1px solid rgba(10,61,98,.10)',
            background:'#F8F9FB', display:'flex', gap:7, flexShrink:0, flexWrap:'wrap' }}>
            {nodeId !== 'root' && (
              <button onClick={goBack}
                style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:6,
                  padding:'8px', borderRadius:'9px', border:'1px solid rgba(10,61,98,.12)',
                  background:'#FFFFFF', fontSize:12, color:'rgba(26,26,46,.55)', cursor:'pointer',
                  fontFamily:'var(--font-body, system-ui)' }}>
                <Icon name="arrow-left" size={12} />Voltar
              </button>
            )}
            {nodeId !== 'root' && (
              <button onClick={reset}
                style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:6,
                  padding:'8px', borderRadius:'9px', border:'1px solid rgba(10,61,98,.12)',
                  background:'#FFFFFF', fontSize:12, color:'rgba(26,26,46,.55)', cursor:'pointer',
                  fontFamily:'var(--font-body, system-ui)' }}>
                <Icon name="home" size={12} />Início
              </button>
            )}
            {nodeId !== 'apoio' && (
              <button onClick={() => navigate('apoio', 'Não encontrei minha resposta')}
                style={{ flex:2, display:'flex', alignItems:'center', justifyContent:'center', gap:6,
                  padding:'8px', borderRadius:'9px',
                  border:'1px solid rgba(139,79,190,.35)',
                  background:'rgba(139,79,190,.07)',
                  fontSize:12, color:'#8B4FBE', cursor:'pointer',
                  fontFamily:'var(--font-body, system-ui)' }}>
                <Icon name="help-circle" size={12} />Não encontrei minha resposta
              </button>
            )}
          </div>
        </div>
      )}

      <style>{`
        @keyframes fabPulse {
          0%   { box-shadow: 0 10px 40px rgba(10,61,98,.32), 0 0 0 0 rgba(26,26,46,.35); }
          60%  { box-shadow: 0 10px 40px rgba(10,61,98,.32), 0 0 0 16px rgba(26,26,46,0); }
          100% { box-shadow: 0 10px 40px rgba(10,61,98,.32), 0 0 0 0  rgba(26,26,46,0); }
        }
        @keyframes chatIn {
          from { opacity:0; transform:translateY(20px) scale(.94); }
          to   { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes chatOut {
          from { opacity:1; transform:translateY(0) scale(1); }
          to   { opacity:0; transform:translateY(14px) scale(.95); }
        }
        @media(max-width:520px){ .chat-fab-label{ display:none; } }
      `}</style>
    </>
  );
}

Object.assign(window, { Chatbot });
</script>

<script type="text/babel">/* App.jsx — single-page scroll navigation, sem rotas */

function App() {
  const [chatOpen, setChatOpen] = React.useState(false);
  const [chatTarget, setChatTarget] = React.useState(null);
  const scrollRef = React.useRef(null);

  const go = (id) => {
    if (id === 'home') {
      scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const el = document.getElementById('sec-' + id);
    if (el && scrollRef.current) {
      const top = el.offsetTop - 80;
      scrollRef.current.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  };

  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  React.useEffect(() => { if (window.__tcDismissPreloader) window.__tcDismissPreloader(); }, []);

  const openChat   = () => { setChatTarget(null); setChatOpen(true); };
  const openChatAt = (nodeId) => { setChatTarget(nodeId); setChatOpen(true); };

  return (
    <div id="scroll-root" ref={scrollRef}
      style={{ height:'100vh', overflowY:'auto', background:'var(--bg-base)' }}>

      <Header go={go} openChat={openChat} />

      <main>
        <Home go={go} openChat={openChat} />
        <ProcessoSection openChatAt={openChatAt} />
        <HormonioSection />
        <RetificacaoSection />
        <LocaisSection />
        <DenunciaSection />
        <BibliotecaSection />
      </main>

      <Footer go={go} openChat={openChat} />

      <Chatbot open={chatOpen} setOpen={setChatOpen}
        targetNode={chatTarget} setTargetNode={setChatTarget} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
